jwt:
  secret: test-only-jwt-secret-key-that-is-at-least-32-bytes-long
  expiration: 3600000

zoop:
  frontend:
    url: http://localhost:3000
  internal:
    api-key: test-only-internal-key

file:
  upload-dir: target/test-uploads

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

social:
  google:
    client-id: test-google-client
    client-secret: test-google-secret
    redirect-uri: http://localhost:3000/google-auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo

spring:
  datasource:
    url: jdbc:h2:mem:zoop-test;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 2525
